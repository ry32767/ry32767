name: Generate Snake

# 貢献グラフを蛇が食べていくアニメーション SVG を生成し、output ブランチへ公開する。
# README からは raw.githubusercontent.com 経由で参照している。
on:
  schedule:
    # 毎日 03:00 JST（18:00 UTC）に再生成
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation (light / dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 生成物だけを output ブランチに置く（main の履歴を汚さないため）
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
